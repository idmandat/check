# Veröffentlicht bei einem neuen "Release" automatisch auf npm und PyPI.
# Dafür in GitHub unter Settings > Secrets and variables > Actions zwei Secrets anlegen:
#   NPM_TOKEN   (Zugriffstoken von npmjs.com)
#   PYPI_TOKEN  (API-Token von pypi.org)
name: Publish
on:
  release:
    types: [published]
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: npm publish --access public
        working-directory: js
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build && twine upload dist/*
        working-directory: python
        env: { TWINE_USERNAME: "__token__", TWINE_PASSWORD: "${{ secrets.PYPI_TOKEN }}" }
